[package]
name = "burn-mamba-example"
version = "0.6.0"
edition = "2024"

[features]
## defaults
default = [] # by default just re-exports common/ as a library
# default = ["native", "backend-flex", "mamba2"] # for native dev
# default = ["native", "backend-wgpu", "mamba2"] # for native wgpu
# default = ["native", "backend-cuda", "mamba2"] # for native cuda
# default = ["native", "backend-tch-gpu", "mamba2"] # for native torch
# default = ["backend-flex", "mamba2"] # for wasm web-console dev - also check .cargo/config.toml
# default = ["backend-flex", "yew", "mamba2"] # for wasm + web-yew dev - also check .cargo/config.toml
#
## mamba version (can have both features only as a library)
mamba1 = ["burn-mamba/mamba1"]
mamba2 = ["burn-mamba/mamba2"]
#
## binary from src/native/main.rs
native = []
#
## burn backend - check README for more info
backend-ndarray = ["burn/ndarray", "burn-mamba/backend-ndarray"]
backend-flex = ["burn/flex", "burn-mamba/backend-flex"]
backend-simd = ["burn/simd", "burn/std", "burn-mamba/dev-simd"]
backend-cpu = ["burn/cpu", "burn-mamba/backend-cpu"]
backend-tch-cpu = ["burn/tch", "dep:cc", "burn-mamba/backend-tch-cpu"]
backend-tch-gpu = ["burn/tch", "dep:cc", "burn-mamba/backend-tch-gpu"]
backend-wgpu = ["burn/wgpu", "burn-mamba/backend-wgpu"]
backend-vulkan = ["burn/vulkan", "burn-mamba/backend-vulkan"]
backend-cuda = ["burn/cuda", "burn-mamba/backend-cuda"]
#
## burn extra features - check README for more info
backend-fusion = ["burn/fusion", "burn-mamba/fusion"]
backend-autotune = ["burn/autotune"]
#
## wasm yew UI
yew = ["dep:yew", "dep:gloo-timers", "dep:humansize", "dep:indexed_db_futures"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "burn_mamba_example"
path = "src/native/main.rs"
required-features = ["native"]

[[bench]]
name = "allocations"
harness = false

[dependencies]
anyhow = "1.0.0"
log = "0.4.28"
pretty_env_logger = "0.5.0"
safetensors = { version = "0.5.2", default-features = false, features = ["std"] }
rand = "0.9.2"
half = "2.6.0"

#
## tokenizer
candle-core = "0.8.4"
candle-transformers = "0.8.4" # used for tokenizer
tokenizers = { version = "0.21.1", default-features = false, features = [
    "unstable_wasm",
] }

### For the main branch. ###
# burn = { version = "0.22.0-pre.1", default-features = false }
burn-mamba = { git = "https://github.com/swfsql/burn-mamba.git", default-features = false, rev = "44d381be27e20608318ff67c173267a8e49435db" }
burn = { git = "https://github.com/tracel-ai/burn.git", rev = "318b8f9ac17b21024bffcefa8197e3c3ef246f01", default-features = false }
### For local development. ###
# burn = { path = "../burn/crates/burn", default-features = false }
# burn-mamba = { path = "../burn-mamba", default-features = false, features = [] }

## non-wasm target
#
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = { version = "0.9.0", default-features = false }
cc = { version = "1.2.43", optional = true }
#
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.hf-hub]
version = "0.3.2"
git = "https://github.com/swfsql/hf-hub.git"
rev = "a411dde1a7ab30d782cb978955b922551fb7eeb1"
default-features = false
features = ["online"]


## wasm target
#
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
wasm-bindgen = { version = "0.2.100", features = ["serde-serialize"] }
wasm-bindgen-futures = "0.4.50"
log = "0.4.26"
console_log = { version = "1.0.0", features = ["color"] }
web-time = "1.1.0"
#
## https://github.com/rust-random/getrandom/#webassembly-support
getrandom = { version = "0.4.2", features = ["wasm_js"] }
#
## yew ui
yew = { version = "0.21.0", features = ["csr"], optional = true }
gloo-timers = { version = "0.3.0", features = ["futures"], optional = true }
humansize = { version = "2.1.3", optional = true }
indexed_db_futures = { version = "0.4.1", optional = true }
#
[target.'cfg(target_arch = "wasm32")'.dependencies.hf-hub]
version = "0.3.2"
git = "https://github.com/swfsql/hf-hub.git"
rev = "a411dde1a7ab30d782cb978955b922551fb7eeb1"
default-features = false
features = ["wasm"]

[dev-dependencies]
divan = "0.1.21"