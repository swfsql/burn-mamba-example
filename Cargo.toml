[package]
name = "burn-mamba-example"
version = "0.9.0"
edition = "2024"

[features]
## the default: only common/, as a library. For an IDE, uncomment one line below.
default = []
# default = ["native", "backend-flex", "mamba2-130m"] # the native binary, on flex
# default = ["native", "backend-wgpu", "mamba2-130m"] # the native binary, on wgpu
# default = ["native", "backend-cuda", "mamba2-130m"] # the native binary, on cuda
# default = ["native", "backend-tch-gpu", "mamba2-130m"] # the native binary, on LibTorch
# default = ["console", "backend-flex", "mamba2-130m"] # the browser console. Also uncomment the target in .cargo/config.toml
# default = ["yew", "backend-flex", "mamba2-130m"] # the browser page. Also uncomment the target in .cargo/config.toml
#
## family features: each adds the blocks of one family, and no checkpoint
mamba1 = ["burn-mamba/mamba1"]
mamba2 = ["burn-mamba/mamba2"]
mamba3 = ["burn-mamba/mamba3"]
#
## checkpoint features: each adds one checkpoint, and its family feature. A
## build can have any set of them. It holds each of its checkpoints, and runs
## the one with the highest priority
## (mamba3-mimo-187m > mamba3-siso-187m > mamba2-130m > mamba1-130m). Natively,
## `MAMBA_CHECKPOINT=<id>` selects another one.
mamba1-130m = ["mamba1"]
mamba2-130m = ["mamba2"]
mamba3-siso-187m = ["mamba3"]
mamba3-mimo-187m = ["mamba3"]
#
## front-end features. A wasm build needs exactly one of `console` and `yew`.
## the native binary, from src/native/main.rs
native = ["dep:pretty_env_logger"]
## the browser console: no page, the output goes to the console log
console = []
#
## backend features. With several of them, `BURN_DEVICE` selects one at run time
backend-ndarray = ["burn/ndarray", "burn-mamba/backend-ndarray"]
backend-flex = ["burn/flex", "burn-mamba/backend-flex"]
backend-simd = ["burn/simd", "burn/std", "burn-mamba/dev-simd"]
backend-cpu = ["burn/cpu", "burn-mamba/backend-cpu"]
backend-tch-cpu = ["burn/tch", "dep:cc", "burn-mamba/backend-tch-cpu"]
backend-tch-gpu = ["burn/tch", "dep:cc", "burn-mamba/backend-tch-gpu"]
backend-wgpu = ["burn/wgpu", "burn-mamba/backend-wgpu"]
backend-vulkan = ["burn/vulkan", "burn-mamba/backend-vulkan"]
backend-cuda = ["burn/cuda", "burn-mamba/backend-cuda"]
#
## backend options: kernel fusion, and autotune
backend-fusion = ["burn/fusion", "burn-mamba/fusion"]
backend-autotune = ["burn/autotune"]
#
## the browser page, built with Yew
yew = ["dep:yew", "dep:gloo-timers", "dep:humansize"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "burn_mamba_example"
path = "src/native/main.rs"
required-features = ["native"]

[[bench]]
name = "allocations"
harness = false
## it profiles `native::main()`, which exists only with this feature
required-features = ["native"]

## the forward and step timings of each checkpoint. See benches/model.rs and bench.sh
[[bench]]
name = "model"
harness = false

[dependencies]
anyhow = "1.0.0"
log = "0.4.28"
## the logger of the native binary
pretty_env_logger = { version = "0.5.0", optional = true }
## src/common/sampling.rs uses only the seeded StdRng and WeightedIndex. The
## default features add `os_rng`, which adds a second `getrandom` (0.3). The
## `getrandom_backend="wasm_js"` rustflag in .cargo/config.toml rejects that
## version, because this build does not turn on its `wasm_js` feature.
rand = { version = "0.9.2", default-features = false, features = ["std", "std_rng"] }
## `Instant` for the timings of the browser front-ends and of
## src/common/assets.rs. Natively, it is `std::time`.
web-time = "1.1.0"

#
## tokenizer.json parsing (see src/common/tokenizer/)
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
unicode-normalization = "0.1.25"

### For the main branch. ###
burn = { version = "0.22.1", default-features = false, features = ["std", "store", "safetensors"] }
burn-mamba = { git = "https://github.com/swfsql/burn-mamba.git", default-features = false, rev = "fefae52cb3388f4fd1ab24ee9be3f5ad99189388" }

### For a burn git revision. ###
# burn = { git = "https://github.com/tracel-ai/burn.git", rev = "a6de085337c847ee13188d6d3085955709cccf38", default-features = false, features = ["std", "store", "safetensors"] }

### For local development. ###
# burn = { path = "../burn/crates/burn", default-features = false, features = ["std", "store", "safetensors"] }
# burn-mamba = { path = "../burn-mamba", default-features = false, features = [] }

## the dependencies of the native builds
#
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cc = { version = "1.2.43", optional = true }
## blocking http client for src/common/hub/sync.rs (rustls, no C dependency)
ureq = "2.12.1"


## the dependencies of the wasm builds
#
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
wasm-bindgen = { version = "0.2.100", features = ["serde-serialize"] }
wasm-bindgen-futures = "0.4.50"
log = "0.4.26"
console_log = { version = "1.0.0", features = ["color"] }
#
## https://github.com/rust-random/getrandom/#webassembly-support
getrandom = { version = "0.4.2", features = ["wasm_js"] }
#
## fetch + IndexedDB, for src/common/hub/wasm.rs
js-sys = "0.3.103"
indexed_db_futures = "0.4.2"
web-sys = { version = "0.3.103", features = [
    "Headers",
    "Request",
    "RequestInit",
    "Response",
    "Window",
] }
#
## the browser page
yew = { version = "0.21.0", features = ["csr"], optional = true }
gloo-timers = { version = "0.3.0", features = ["futures"], optional = true }
humansize = { version = "2.1.3", optional = true }

[dev-dependencies]
divan = "0.1.21"
## `cargo_bench_support` lets a `harness = false` bench run with
## `cargo bench`. The default features also add rayon and plotters.
criterion = { version = "0.8.2", default-features = false, features = [
    "cargo_bench_support",
] }