name: Deploy
on:
    push:
        branches:
            - main
    # tags:
    # pull_request:
env:
    CARGO_TERM_COLOR: always

    # if a test fails, shows the backtrace
    RUST_BACKTRACE: 1

    # if depending on a ssh crate, use the git cli.
    CARGO_NET_GIT_FETCH_WITH_CLI: true
jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            # The native steps of the check use stable. The nightly install below
            # stays the default toolchain, so wasm-pack uses nightly.
            - name: Install stable (for the native steps of the check)
              uses: dtolnay/rust-toolchain@stable

            # rust compiler for creating binaries
            - name: Install latest nightly (for wasm)
              uses: dtolnay/rust-toolchain@nightly
              with:
                  targets: wasm32-unknown-unknown
                  components: rustfmt, clippy

            - name: Install Wasm Target
              run: |
                  set -e
                  rustup target add wasm32-unknown-unknown

            # Runs some Rust-related caching
            - uses: Swatinem/rust-cache@v2

            # A failed check stops the deploy.
            - name: Check
              run: ./scripts/check.sh
              env:
                  CI: true
                  RUSTUP_TOOLCHAIN: stable

            - name: Download wasm-pack
              run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

            - name: Build Release wasm for mamba1-130m
              run: wasm-pack build --release --target web --out-dir "frontend/mamba1-130m/pkg" --no-opt --no-default-features --features "backend-flex,backend-simd,yew,mamba1-130m"

            - name: Build Release wasm for mamba2-130m
              run: wasm-pack build --release --target web --out-dir "frontend/mamba2-130m/pkg" --no-opt --no-default-features --features "backend-flex,backend-simd,yew,mamba2-130m"

            - name: Build Release wasm for mamba3-siso-187m
              run: wasm-pack build --release --target web --out-dir "frontend/mamba3-siso-187m/pkg" --no-opt --no-default-features --features "backend-flex,backend-simd,yew,mamba3-siso-187m"

            - name: Build Release wasm for mamba3-mimo-187m
              run: wasm-pack build --release --target web --out-dir "frontend/mamba3-mimo-187m/pkg" --no-opt --no-default-features --features "backend-flex,backend-simd,yew,mamba3-mimo-187m"

            - name: Prepare Wasm Deploy
              run: |
                  set -e
                  for checkpoint in mamba1-130m mamba2-130m mamba3-siso-187m mamba3-mimo-187m; do
                      # Prepare the publishing structure
                      mkdir -p "publish/$checkpoint"

                      # move the page files and the bundle
                      mv "frontend/$checkpoint/index.html" "publish/$checkpoint/"
                      mv "frontend/$checkpoint/index.js" "publish/$checkpoint/"
                      mv "frontend/$checkpoint/pkg/" "publish/$checkpoint/pkg/"

                      # rm gitignore
                      rm "publish/$checkpoint/pkg/.gitignore"
                  done

            # Publish
            - name: Frontend Deploy
              uses: peaceiris/actions-gh-pages@v3
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_branch: gh-pages
                  publish_dir: ./publish
                  keep_files: false
