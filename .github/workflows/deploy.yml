name: Deploy
on:
    push:
        branches:
            - main
    # tags:
    # pull_request:
env:
    CARGO_TERM_COLOR: always

    # if a test fails, shows the backtrace
    RUST_BACKTRACE: 1

    # if depending on a ssh crate, use the git cli.
    CARGO_NET_GIT_FETCH_WITH_CLI: true
jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            # rust compiler for creating binaries
            - name: Install latest nightly (for wasm)
              uses: dtolnay/rust-toolchain@nightly
              with:
                  targets: wasm32-unknown-unknown
                  components: rustfmt, clippy

            - name: Install Wasm Target
              run: |
                  set -e
                  rustup target add wasm32-unknown-unknown

            # Runs some Rust-related caching
            - uses: Swatinem/rust-cache@v2

            - name: Download wasm-pack
              run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

            - name: Build Release wasm for Mamba1
              run: wasm-pack build --release --target web --out-dir "frontend/mamba1/pkg" --no-opt --no-default-features --features "backend-flex,backend-simd,yew,mamba1"

            - name: Build Release wasm for Mamba2
              run: wasm-pack build --release --target web --out-dir "frontend/mamba2/pkg" --no-opt --no-default-features --features "backend-flex,backend-simd,yew,mamba2"

            - name: Build Release wasm for Mamba3 SISO
              run: wasm-pack build --release --target web --out-dir "frontend/mamba3-siso/pkg" --no-opt --no-default-features --features "backend-flex,backend-simd,yew,mamba3-siso"

            - name: Build Release wasm for Mamba3 MIMO
              run: wasm-pack build --release --target web --out-dir "frontend/mamba3-mimo/pkg" --no-opt --no-default-features --features "backend-flex,backend-simd,yew,mamba3-mimo"

            - name: Prepare Wasm Deploy
              run: |
                  set -e
                  for model in mamba1 mamba2 mamba3-siso mamba3-mimo; do
                      # Prepare the publishing structure
                      mkdir -p "publish/$model"

                      # move assets
                      mv "frontend/$model/index.html" "publish/$model/"
                      mv "frontend/$model/index.js" "publish/$model/"
                      mv "frontend/$model/pkg/" "publish/$model/pkg/"

                      # rm gitignore
                      rm "publish/$model/pkg/.gitignore"
                  done

            # Publish
            - name: Frontend Deploy
              uses: peaceiris/actions-gh-pages@v3
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_branch: gh-pages
                  publish_dir: ./publish
                  keep_files: false
